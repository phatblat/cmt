de omp/1 mode=supervised\".into());\n+        assert_eq!(m.validate(), Ok(()));\n+    }\n+\n+    #[test]\n+    fn header_over_100_chars_is_rejected() {\n+        let mut m = Message::new(CommitType::Refactor, None, \"x\".repeat(90));\n+        assert_eq!(m.validate(), Ok(()));\n+        m.subject = \"x\".repeat(91);\n+        assert_eq!(\n+            m.validate(),\n+            Err(\"header is 101 chars; commitlint limit is 100\".into())\n+        );\n+    }\n+\n+    #[test]\n+    fn retired_and_unknown_types_are_rejected() {\n+        assert_eq!(\"feat\".parse::<CommitType>(), Ok(CommitType::Feat));\n+        assert_eq!(\n+            \"chore\".parse::<CommitType>(),\n+            Err(\"retired type `chore`: use a specific type (`chore`), `refactor` or `build` (`style`), or the original type plus `--reverts` (`revert`)\".into())\n+        );\n+        assert_eq!(\n+            \"wip\".parse::<CommitType>(),\n+            Err(\"unknown type `wip`\".into())\n+        );\n+    }\n+}\ndiff --git a/src/scope.rs b/src/scope.rs\nnew file mode 100644\nindex 0000000..7676b5b\n--- /dev/null\n+++ b/src/scope.rs\n@@ -0,0 +1,64 @@\n+/// Leading directories that name a layout, not a component; they are dropped\n+/// before the first path segment is read as the scope.\n+const ROOTS: [&str; 9] = [\n+    \"src\", \"lib\", \"app\", \"pkg\", \"crates\", \"packages\", \"docs\", \"tests\", \"test\",\n+];\n+\n+/// The component every path lives under, or `None` when they disagree or a\n+/// path sits directly in a root (`src/main.rs` has no scope).\n+pub fn scope(paths: &[&str]) -> Option<String> {\n+    let mut common: Option<&str> = None;\n+    for path in paths {\n+        let mut parts = path.split('/');\n+        let mut first = parts.next()?;\n+        if ROOTS.contains(&first) {\n+            first = parts.next()?;\n+        }\n+        // A scope is a directory: there has to be something below it.\n+        parts.next()?;\n+        match common {\n+            None => common = Some(first),\n+            Some(seen) if seen == first => {}\n+            Some(_) => return None,\n+        }\n+    }\n+    common.map(str::to_lowercase)\n+}\n+\n+#[cfg(test)]\n+mod tests {\n+    use super::*;\n+\n+    #[test]\n+    fn shared_component_under_a_root() {\n+        assert_eq!(\n+            scope(&[\"src/parser/lex.rs\", \"src/parser/ast.rs\"]),\n+            Some(\"parser\".into())\n+        );\n+    }\n+\n+    #[test]\n+    fn workspace_crate_is_the_scope() {\n+        assert_eq!(scope(&[\"crates/core/src/x.rs\"]), Some(\"core\".into()));\n+    }\n+\n+    #[test]\n+    fn file_directly_in_root_has_no_scope() {\n+        assert_eq!(scope(&[\"src/main.rs\"]), None);\n+    }\n+\n+    #[test]\n+    fn disagreeing_components_have_no_scope() {\n+        assert_eq!(scope(&[\"src/a/x.rs\", \"src/b/y.rs\"]), None);\n+    }\n+\n+    #[test]\n+    fn docs_subdirectory_is_a_scope() {\n+        assert_eq!(scope(&[\"docs/guide/a.md\"]), Some(\"guide\".into()));\n+    }\n+\n+    #[test]\n+    fn empty_input_has_no_scope() {\n+        assert_eq!(scope(&[]), None);\n+    }\n+}\ndiff --git a/src/subject.rs b/src/subject.rs\nnew file mode 100644\nindex 0000000..342fe87\n--- /dev/null\n+++ b/src/subject.rs\n@@ -0,0 +1,164 @@\n+use crate::change::{Change, Status};\n+\n+const MAX_LEN: usize = 72;\n+\n+/// Mechanical subject: `<verb> <path>` for one change, `<verb> <N> files in\n+/// <dir>` for several, shortened when it would run past 72 characters.\n+pub fn subject(changes: &[Change]) -> String {\n+    let verb = verb(changes);\n+    if let [only] = changes {\n+        let full = match &only.status {\n+            Status::Renamed { from } => format!(\"rename {from} to {}\", only.path),\n+            _ => format!(\"{verb} {}\", only.path),\n+        };\n+        if fits(&full) {\n+            return full;\n+        }\n+        return format!(\"{verb} {}\", basename(&only.path));\n+    }\n+    let n = changes.len();\n+    if let Some(dir) = common_dir(changes) {\n+        let with_dir = format!(\"{verb} {n} files in {dir}\");\n+        if fits(&with_dir) {\n+            return with_dir;\n+        }\n+    }\n+    format!(\"{verb} {n} files\")\n+}\n+\n+fn fits(s: &str) -> bool {\n+    s.chars().count() <= MAX_LEN\n+}\n+\n+fn verb(changes: &[Change]) -> &'static str {\n+    let all = |pred: fn(&Status) -> bool| changes.iter().all(|c| pred(&c.status));\n+    if all(|s| *s == Status::Added) {\n+        \"add\"\n+    } else if all(|s| *s == Status::Deleted) {\n+        \"remove\"\n+    } else if all(|s| matches!(s, Status::Renamed { .. })) {\n+        \"rename\"\n+    } else {\n+        \"update\"\n+    }\n+}\n+\n+fn basename(path: &str) -> &str {\n+    path.rsplit('/').next().unwrap_or(path)\n+}\n+\n+/// Longest directory prefix shared by every path; `None` at the repo root.\n+fn common_dir(changes: &[Change]) -> Option<String> {\n+    let mut common: Option<Vec<&str>> = None;\n+    for change in changes {\n+        let mut dirs: Vec<&str> = change.path.split('/').collect();\n+        dirs.pop();\n+        common = Some(match common {\n+            None => dirs,\n+            Some(seen) => seen\n+                .iter()\n+                .zip(&dirs)\n+                .take_while(|(a, b)| a == b)\n+                .map(|(a, _)| *a)\n+                .collect(),\n+        });\n+    }\n+    let dirs = common?;\n+    if dirs.is_empty() {\n+        None\n+    } else {\n+        Some(dirs.join(\"/\"))\n+    }\n+}\n+\n+#[cfg(test)]\n+mod tests {\n+    use super::*;\n+\n+    fn change(path: &str, status: Status) -> Change {\n+        Change {\n+            path: path.into(),\n+            status,\n+        }\n+    }\n+\n+    #[test]\n+    fn single_change_names_the_path_with_its_verb() {\n+        assert_eq!(\n+            subject(&[change(\"src/a.rs\", Status::Added)]),\n+            \"add src/a.rs\"\n+        );\n+        assert_eq!(\n+            subject(&[change(\"src/a.rs\", Status::Modified)]),\n+            \"update src/a.rs\"\n+        );\n+        assert_eq!(\n+            subject(&[change(\"src/a.rs\", Status::Deleted)]),\n+            \"remove src/a.rs\"\n+        );\n+    }\n+\n+    #[test]\n+    fn rename_names_both_paths() {\n+        assert_eq!(\n+            subject(&[change(\n+                \"src/b.rs\",\n+                Status::Renamed {\n+                    from: \"src/a.rs\".into()\n+                }\n+            )]),\n+            \"rename src/a.rs to src/b.rs\"\n+        );\n+    }\n+\n+    #[test]\n+    fn mixed_statuses_are_an_update() {\n+        assert_eq!(\n+            subject(&[\n+                change(\"src/a.rs\", Status::Added),\n+                change(\"src/b.rs\", Status::Deleted),\n+            ]),\n+            \"update 2 files in src\"\n+        );\n+    }\n+\n+    #[test]\n+    fn uniform_statuses_keep_their_verb_across_files() {\n+        assert_eq!(\n+            subject(&[\n+                change(\"src/a.rs\", Status::Deleted),\n+                change(\"src/b.rs\", Status::Deleted),\n+            ]),\n+            \"remove 2 files in src\"\n+        );\n+    }\n+\n+    #[test]\n+    fn no_common_directory_drops_the_location() {\n+        assert_eq!(\n+            subject(&[\n+                change(\"src/a.rs\", Status::Modified),\n+                change(\"README.md\", Status::Modified),\n+            ]),\n+            \"update 2 files\"\n+        );\n+    }\n+\n+    #[test]\n+    fn long_single_path_falls_back_to_basename() {\n+        let path = format!(\"{}/x.rs\", \"d\".repeat(70));\n+        assert_eq!(subject(&[change(&path, Status::Modified)]), \"update x.rs\");\n+    }\n+\n+    #[test]\n+    fn long_common_directory_falls_back_to_count() {\n+        let dir = \"d\".repeat(70);\n+        assert_eq!(\n+            subject(&[\n+                change(&format!(\"{dir}/a.rs\"), Status::Modified),\n+                change(&format!(\"{dir}/b.rs\"), Status::Modified),\n+            ]),\n+            \"update 2 files\"\n+        );\n+    }\n+}\ndiff --git a/tests/cli.rs b/tests/cli.rs\nnew file mode 100644\nindex 0000000..234903f\n--- /dev/null\n+++ b/tests/cli.rs\n@@ -0,0 +1,232 @@\n+use std::fs;\n+use std::path::Path;\n+use std::process::{Command, Output};\n+\n+use tempfile::TempDir;\n+\n+struct Repo {\n+    dir: TempDir,\n+}\n+\n+impl Repo {\n+    fn unborn() -> Self {\n+        let dir = tempfile::tempdir().expect(\"tempdir\");\n+        let repo = Self { dir };\n+        repo.git(&[\"init\", \"-q\", \"-b\", \"main\"]);\n+        repo\n+    }\n+\n+    /// One `seed` commit containing `src/lib.rs`, `README.md`, `Cargo.lock`.\n+    fn seeded() -> Self {\n+        let repo = Self::unborn();\n+        repo.write(\"src/lib.rs\", \"pub fn f() {}\\n\");\n+        repo.write(\"README.md\", \"# seed\\n\");\n+        repo.write(\"Cargo.lock\", \"# lock\\n\");\n+        repo.git(&[\"add\", \"-A\"]);\n+        repo.git(&[\"commit\", \"-q\", \"-m\", \"seed\"]);\n+        repo\n+    }\n+\n+    fn path(&self) -> &Path {\n+        self.dir.path()\n+    }\n+\n+    fn write(&self, rel: &str, content: &str) {\n+        let path = self.path().join(rel);\n+        fs::create_dir_all(path.parent().unwrap()).unwrap();\n+        fs::write(path, content).unwrap();\n+    }\n+\n+    fn command(&self, program: &str) -> Command {\n+        let mut cmd = Command::new(program);\n+        cmd.current_dir(self.path())\n+            .env(\"GIT_CONFIG_GLOBAL\", \"/dev/null\")\n+            .env(\"GIT_CONFIG_NOSYSTEM\", \"1\")\n+            .env(\"GIT_AUTHOR_NAME\", \"t\")\n+            .env(\"GIT_AUTHOR_EMAIL\", \"t@t\")\n+            .env(\"GIT_COMMITTER_NAME\", \"t\")\n+            .env(\"GIT_COMMITTER_EMAIL\", \"t@t\");\n+        cmd\n+    }\n+\n+    fn git(&self, args: &[&str]) -> String {\n+        let out = self.command(\"git\").args(args).output().expect(\"run git\");\n+        assert!(\n+            out.status.success(),\n+            \"git {args:?} failed: {}\",\n+            String::from_utf8_lossy(&out.stderr)\n+        );\n+        String::from_utf8(out.stdout).unwrap()\n+    }\n+\n+    fn cmt(&self, args: &[&str]) -> Output {\n+        self.command(env!(\"CARGO_BIN_EXE_cmt\"))\n+            .args(args)\n+            .output()\n+            .expect(\"run cmt\")\n+    }\n+\n+    fn subjects(&self) -> String {\n+        self.git(&[\"log\", \"--reverse\", \"--format=%s\"])\n+    }\n+\n+    /// The stored commit message, byte for byte (`%B` appends its own newline).\n+    fn last_body(&self) -> String {\n+        let object = self.git(&[\"cat-file\", \"commit\", \"HEAD\"]);\n+        object\n+            .split_once(\"\\n\\n\")\n+            .expect(\"commit object\")\n+            .1\n+            .to_string()\n+    }\n+\n+    fn head(&self) -> Option<String> {\n+        let out = self\n+            .command(\"git\")\n+            .args([\"rev-parse\", \"-q\", \"--verify\", \"HEAD\"])\n+            .output()\n+            .unwrap();\n+        out.status\n+            .success()\n+            .then(|| String::from_utf8(out.stdout).unwrap())\n+    }\n+\n+    fn status(&self) -> String {\n+        self.git(&[\"status\", \"--porcelain\"])\n+    }\n+}\n+\n+fn stdout(out: &Output) -> String {\n+    String::from_utf8(out.stdout.clone()).unwrap()\n+}\n+\n+fn stderr(out: &Output) -> String {\n+    String::from_utf8(out.stderr.clone()).unwrap()\n+}\n+\n+#[test]\n+fn dry_run_prints_without_committing() {\n+    let repo = Repo::unborn();\n+    repo.write(\".gitignore\", \"/target\\n\");\n+    let out = repo.cmt(&[\"--dry-run\"]);\n+    assert_eq!(out.status.code(), Some(0), \"{}\", stderr(&out));\n+    assert_eq!(stdout(&out), \"ignore: add .gitignore\\n\");\n+    assert_eq!(repo.head(), None);\n+}\n+\n+#[test]\n+fn initial_commits_are_split_per_group() {\n+    let repo = Repo::unborn();\n+    repo.write(\".gitignore\", \"/target\\n\");\n+    repo.write(\"src/main.rs\", \"fn main() {}\\n\");\n+    let out = repo.cmt(&[]);\n+    assert_eq!(out.status.code(), Some(0), \"{}\", stderr(&out));\n+    assert_eq!(\n+        repo.subjects(),\n+        \"ignore: add .gitignore\\nrefactor: add src/main.rs\\n\"\n+    );\n+    assert_eq!(repo.status(), \"\");\n+}\n+\n+#[test]\n+fn source_and_docs_become_two_commits() {\n+    let repo = Repo::seeded();\n+    repo.write(\"src/lib.rs\", \"pub fn f() -> u8 { 1 }\\n\");\n+    repo.write(\"README.md\", \"# seed\\n\\nmore\\n\");\n+    let out = repo.cmt(&[]);\n+    assert_eq!(out.status.code(), Some(0), \"{}\", stderr(&out));\n+    assert_eq!(\n+        stdout(&out),\n+        \"refactor: update src/lib.rs\\n\\ndocs: update README.md\\n\"\n+    );\n+    assert_eq!(\n+        repo.subjects(),\n+        \"seed\\nrefactor: update src/lib.rs\\ndocs: update README.md\\n\"\n+    );\n+    assert_eq!(repo.status(), \"\");\n+}\n+\n+#[test]\n+fn deps_group_needs_bumps_and_nothing_is_committed_without_it() {\n+    let repo = Repo::seeded();\n+    let before = repo.head();\n+    repo.write(\"Cargo.lock\", \"# lock\\n# moved\\n\");\n+    let out = repo.cmt(&[]);\n+    assert_eq!(out.status.code(), Some(2));\n+    assert!(\n+        stderr(&out).contains(\"requires --bumps\"),\n+        \"{}\",\n+        stderr(&out)\n+    );\n+    assert_eq!(repo.head(), before);\n+\n+    let out = repo.cmt(&[\"--bumps\", \"serde 1.0.0 -> 1.0.1\"]);\n+    assert_eq!(out.status.code(), Some(0), \"{}\", stderr(&out));\n+    assert_eq!(\n+        repo.last_body(),\n+        \"deps: update Cargo.lock\\n\\nBumps: serde 1.0.0 -> 1.0.1\\n\"\n+    );\n+}\n+\n+#[test]\n+fn clean_tree_is_exit_3() {\n+    let repo = Repo::seeded();\n+    let out = repo.cmt(&[]);\n+    assert_eq!(out.status.code(), Some(3));\n+    assert_eq!(stderr(&out), \"nothing to commit\\n\");\n+}\n+\n+#[test]\n+fn type_override_makes_one_commit_with_provenance() {\n+    let repo = Repo::seeded();\n+    repo.write(\"src/parser/a.rs\", \"pub fn a() {}\\n\");\n+    repo.write(\"src/parser/b.rs\", \"pub fn b() {}\\n\");\n+    let out = repo.cmt(&[\"--type\", \"feat\", \"--assisted-by\", \"m h/1 mode=autonomous\"]);\n+    assert_eq!(out.status.code(), Some(0), \"{}\", stderr(&out));\n+    assert_eq!(\n+        repo.last_body(),\n+        \"feat(parser): add 2 files in src/parser\\n\\nAssisted-by: m h/1 mode=autonomous\\n\"\n+    );\n+    assert_eq!(\n+        repo.subjects(),\n+        \"seed\\nfeat(parser): add 2 files in src/parser\\n\"\n+    );\n+}\n+\n+#[test]\n+fn mixed_set_with_intent_flag_needs_type() {\n+    let repo = Repo::seeded();\n+    repo.write(\"src/lib.rs\", \"pub fn f() -> u8 { 1 }\\n\");\n+    repo.write(\"README.md\", \"# seed\\n\\nmore\\n\");\n+    let out = repo.cmt(&[\"--subject\", \"x\"]);\n+    assert_eq!(out.status.code(), Some(2));\n+    assert!(\n+        stderr(&out).contains(\"needs --type; inferred groups: refactor, docs\"),\n+        \"{}\",\n+        stderr(&out)\n+    );\n+    assert_eq!(repo.subjects(), \"seed\\n\");\n+}\n+\n+#[test]\n+fn pathspec_limits_the_selection_and_plan_precedes_source() {\n+    let repo = Repo::seeded();\n+    repo.write(\"src/lib.rs\", \"pub fn f() -> u8 { 1 }\\n\");\n+    repo.write(\"README.md\", \"# seed\\n\\nmore\\n\");\n+    let out = repo.cmt(&[\"README.md\"]);\n+    assert_eq!(out.status.code(), Some(0), \"{}\", stderr(&out));\n+    assert_eq!(repo.subjects(), \"seed\\ndocs: update README.md\\n\");\n+    assert_eq!(repo.status(), \" M src/lib.rs\\n\");\n+\n+    repo.write(\n+        \"PLAN.md\",\n+        \"# Plan\\n\\nImplements docs/decisions/2026-09-06-x.md.\\n\",\n+    );\n+    let out = repo.cmt(&[]);\n+    assert_eq!(out.status.code(), Some(0), \"{}\", stderr(&out));\n+    assert_eq!(\n+        repo.subjects(),\n+        \"seed\\ndocs: update README.md\\nplan: start 2026-09-06-x\\nrefactor: update src/lib.rs\\n\"\n+    );\n+    assert_eq!(repo.status(), \"\");\n+}\n"
